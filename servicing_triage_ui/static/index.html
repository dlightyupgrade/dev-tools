<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="triage-token" content="__TOKEN__">
  <title>Servicing Triage</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Servicing triage</h1>
        <p id="meta" class="soft"></p>
      </div>
      <div class="run">
        <label for="window" class="soft">Window</label>
        <select id="window" aria-label="Days of failures to triage">
          <option value="1">1 day</option>
          <option value="2" selected>2 days</option>
          <option value="3">3 days</option>
          <option value="7">7 days</option>
        </select>
        <button id="refresh" class="btn primary" type="button">Refresh</button>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>
    <section id="summary" class="summary" aria-label="Summary"></section>
    <section id="unchecked" class="panel warn" aria-labelledby="unchecked-h" hidden>
      <h2 id="unchecked-h">Sensors that did not run</h2>
      <ul id="unchecked-list"></ul>
    </section>

    <section class="toolbar" aria-label="Filters">
      <div class="chips" id="disposition-chips" role="group" aria-label="Who must act"></div>
      <div class="chips" id="area-chips" role="group" aria-label="Area"></div>
      <div class="tools">
        <input id="search" type="search" placeholder="Search code, task or text" aria-label="Search findings">
        <label class="check"><input id="hide-known" type="checkbox" checked> Hide known</label>
      </div>
    </section>

    <main id="list" class="ledger" aria-label="Findings"></main>
    <footer id="foot" class="soft"></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
