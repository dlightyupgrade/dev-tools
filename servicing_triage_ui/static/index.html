<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="triage-token" content="__TOKEN__">
  <title>Servicing Triage</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Servicing triage</h1>
        <p id="meta" class="soft"></p>
      </div>
      <div class="run" id="run-failures">
        <label for="window" class="soft">Window</label>
        <select id="window" aria-label="Days of failures to triage">
          <option value="1">1 day</option>
          <option value="2" selected>2 days</option>
          <option value="3">3 days</option>
          <option value="7">7 days</option>
        </select>
        <button id="refresh" class="btn primary" type="button">Refresh</button>
      </div>
      <div class="run" id="run-stats" hidden>
        <label for="stats-day" class="soft">Day</label>
        <select id="stats-day" aria-label="Day of stats">
          <option value="yesterday" selected>Yesterday</option>
          <option value="today">Today so far</option>
        </select>
        <button id="refresh-stats" class="btn primary" type="button">Refresh stats</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Views">
      <a id="tab-failures" href="#/">Failures</a>
      <a id="tab-stats" href="#/stats">Daily stats</a>
    </nav>

    <div id="banner" class="banner" role="status" hidden></div>
    <div id="page"></div>
    <footer id="foot" class="soft"></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
